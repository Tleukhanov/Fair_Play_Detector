[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-play-detector"
version = "0.1.0"
description = "Probabilistic fair-play analysis service for public Lichess games."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "alembic>=1.14,<2.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "aiosqlite>=0.20,<1.0",
  "httpx>=0.27,<1.0",
  "python-chess>=1.999,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.6,<1.0",
]
dataset = [
  "pyarrow>=18.0,<24.0",
  "zstandard>=0.23,<1.0",
]
ml = [
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.5,<2.0",
  "xgboost>=2.1,<4.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
# The dev venv and CI run Python 3.12; numpy 2.x ships stubs that use the
# `type` statement, which mypy cannot parse when targeting 3.11.
python_version = "3.12"
strict = true
files = ["apps", "packages"]

# Third-party modules without a py.typed marker or bundled stubs. First-party
# code stays under `strict = true`.
[[tool.mypy.overrides]]
module = [
  "joblib",
  "joblib.*",
  "pandas",
  "pandas.*",
  "pyarrow",
  "pyarrow.*",
  "scipy",
  "scipy.*",
  "sklearn",
  "sklearn.*",
  "xgboost",
  "xgboost.*",
]
ignore_missing_imports = true

# Those modules already carry per-line `# type: ignore[import-untyped]` comments.
# With the overrides above those comments are redundant, but touching them is
# owned by the ML/API branches, so tolerate the redundant ignores there only.
[[tool.mypy.overrides]]
module = [
  "packages.ml.data",
  "packages.ml.features",
  "packages.ml.game_features",
  "packages.ml.scorer",
  "packages.ml.train",
  "apps.api.app.workers.scoring_factory",
]
disable_error_code = ["unused-ignore"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
