name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          sudo ln -sf /usr/games/stockfish /usr/local/bin/stockfish
          test -x /usr/local/bin/stockfish

      - name: Install project with dev, dataset, and ml extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,dataset,ml]"

      - name: Ruff
        run: python -m ruff check apps packages tests scripts

      - name: Mypy
        run: python -m mypy

      - name: Pytest
        run: python -m pytest -q
